<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report item</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a href="index.html">FindIt</a><a href="dashboard.html">Dashboard</a></nav><main class="panel"><h1>Report lost or found item</h1><form id="itemForm" enctype="multipart/form-data"><label>Report type<select name="type"><option value="lost">Lost</option><option value="found">Found</option></select></label><label>Item name<input name="title" required></label><label>Category<input name="category" required></label><label>Location<input name="location" required></label><label>Description<textarea name="description"></textarea></label><label>Photo<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><button>Submit report</button></form><p id="message"></p></main><script src="js/auth.js"></script><script src="js/items.js"></script></body></html>
